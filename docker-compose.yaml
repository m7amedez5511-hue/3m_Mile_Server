services:
  3mMile-app:
    container_name: 3mMile-app
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Pinned so the container always listens on the port `expose`, the Dockerfile and
      # the nginx upstream all assume. The repo `.env` sets PORT=4000 for LOCAL runs,
      # because Next.js dev owns 3000 on the developer's machine — without this override
      # that value would leak into the container and nginx would proxy to a dead port.
      PORT: 3000
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    container_name: 3mMile-nginx
    image: nginx:1.27-alpine
   
    environment:
      API_SERVER_NAME: ${API_SERVER_NAME:-localhost}
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-3mMile-app}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      3mMile-app:
        condition: service_started
    restart: always

  mongo:
    image: mongo:7
    container_name: 3mMile-mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - 3mMile_mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping: 1})'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express
    restart: always
    profiles:
      - dev-tools
    expose:
      - "8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongo

  redis:
    image: redis:8
    container_name: 3mMile-redis
    restart: always
    expose:
      - "6379"

volumes:
  3mMile_mongo_data: