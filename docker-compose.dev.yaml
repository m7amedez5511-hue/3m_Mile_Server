services:
  3mMile-app:
    image: 3mmile-app:dev
    volumes:
      - ./src:/app/src
      - ./public/uploads:/app/public/uploads
    build:
      context: .
      target: development
    ports:
      - "3001:3000"
    environment:
      - RUN_DB_SEED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      - API_SERVER_NAME=${API_SERVER_NAME:-localhost}

  nginx:
    ports:
      - "8082:80"
    environment:
        API_SERVER_NAME: ${API_SERVER_NAME:-localhost}
        API_UPSTREAM_HOST: 3mMile-app

  mongo:
    ports:
      - "27018:27017"

  redis:
    ports:
      - "6380:6379"

  mongo-express:
    profiles: []
    ports:
      - "8081:8081"